<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 20 50 24">
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <!-- tube: straight body with a rounded far end -->
      <path d="M13 24.5 H52 A4 7.5 0 0 1 52 39.5 H13 Z" fill="#fff"/>
      <!-- open near end: rim, gap, hole -->
      <ellipse cx="13" cy="32" rx="4.6" ry="7.5" fill="#fff"/>
      <ellipse cx="13" cy="32" rx="4.6" ry="7.5" fill="none" stroke="#000" stroke-width="1.6"/>
      <ellipse cx="13" cy="32" rx="2.5" ry="4.9" fill="#000"/>
      <!-- plain lug sleeve, separated from the tube by a gap; its near end drawn as a ring edge -->
      <path d="M29 22 H46 A4.4 10 0 0 1 46 42 H29 A4.4 10 0 0 1 29 22 Z" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M29 22 H46 A4.4 10 0 0 1 46 42 H29 A4.4 10 0 0 1 29 22 Z" fill="#fff"/>
      <ellipse cx="29" cy="32" rx="4.4" ry="10" fill="none" stroke="#000" stroke-width="1.4"/>
    </mask>
  </defs>
  
  <rect width="64" height="64" fill="#ecede9" mask="url(#cut)"/>
</svg>
