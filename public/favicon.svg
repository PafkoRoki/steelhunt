<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <!-- tube: straight body with a rounded far end -->
      <path d="M13 24.5 H52 A4 7.5 0 0 1 52 39.5 H13 Z" fill="#fff"/>
      <!-- open near end: rim, gap, hole -->
      <ellipse cx="13" cy="32" rx="4.6" ry="7.5" fill="#fff"/>
      <ellipse cx="13" cy="32" rx="4.6" ry="7.5" fill="none" stroke="#000" stroke-width="1.6"/>
      <ellipse cx="13" cy="32" rx="2.5" ry="4.9" fill="#000"/>
      <!-- lug sleeve with a spearpoint, separated from the tube by a gap -->
      <path d="M32 22 H46 A4.4 10 0 0 1 46 42 H32 Q27 38 21 32 Q27 26 32 22 Z" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M32 22 H46 A4.4 10 0 0 1 46 42 H32 Q27 38 21 32 Q27 26 32 22 Z" fill="#fff"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141516"/>
  <rect width="64" height="64" fill="#ecede9" mask="url(#cut)"/>
</svg>
