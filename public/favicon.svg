<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <!-- tube behind the sleeve, rounded far end -->
      <path d="M27 25.5 H57 A3.2 6.5 0 0 1 57 38.5 H27 Z" fill="#fff"/>
      <!-- sleeve: gap around it, then the sleeve, then the outline of its near face -->
      <path d="M27 22.5 H41 A4.4 9.5 0 0 1 41 41.5 H27 A4.4 9.5 0 0 1 27 22.5 Z" fill="none" stroke="#000" stroke-width="2.4"/>
      <path d="M27 22.5 H41 A4.4 9.5 0 0 1 41 41.5 H27 A4.4 9.5 0 0 1 27 22.5 Z" fill="#fff"/>
      <ellipse cx="27" cy="32" rx="4.4" ry="9.5" fill="none" stroke="#000" stroke-width="1.3"/>
      <!-- tube in front of the sleeve, coming out of the sleeve face -->
      <path d="M9 25.5 H27 V38.5 H9 Z" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M9 25.5 H27 V38.5 H9 Z" fill="#fff"/>
      <!-- open near end of the tube: rim, gap, hole -->
      <ellipse cx="9" cy="32" rx="3.8000000000000003" ry="6.5" fill="#fff"/>
      <ellipse cx="9" cy="32" rx="3.8000000000000003" ry="6.5" fill="none" stroke="#000" stroke-width="1.4"/>
      <ellipse cx="9" cy="32" rx="2" ry="4.1" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141516"/>
  <rect x="0" y="0" width="64" height="64" fill="#ecede9" mask="url(#cut)"/>
</svg>
