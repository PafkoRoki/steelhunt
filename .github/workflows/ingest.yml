name: Ingest listings

# Scheduled search: every 6 hours (+ manual "Run workflow" button).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: eBay via official Browse API (skipped when the secrets are not set)
        run: npx tsx scripts/scout.ts --only=ebay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

      - name: Run ingestion (each source isolated; failures are logged, not fatal)
        run: npm run ingest
        env:
          # Configure in Settings → Secrets and variables → Actions. Never exposed to the frontend.
          ALLEGRO_CLIENT_ID: ${{ secrets.ALLEGRO_CLIENT_ID }}
          ALLEGRO_CLIENT_SECRET: ${{ secrets.ALLEGRO_CLIENT_SECRET }}

      - name: Commit updated data
        run: |
          git config user.name "steelhunt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/imports/auto-ebay.json 2>/dev/null || git add public/data
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: ingest $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash
            git push
          fi
