<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 72% 48%, #232627 0%, #141516 62%, #0e0f0f 100%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #ecede9;
    position: relative;
  }
  .frame {
    position: absolute; right: -235px; top: 40px; width: 940px; height: 588px;
    background: url(3d/preview-three_quarter.png) center / cover no-repeat;
    mix-blend-mode: lighten;
    -webkit-mask-image: radial-gradient(ellipse at 55% 50%, #000 48%, transparent 72%);
            mask-image: radial-gradient(ellipse at 55% 50%, #000 48%, transparent 72%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; }
  .name { font-size: 76px; font-weight: 700; letter-spacing: 0.06em; line-height: 1; }
  .lead { margin-top: 34px; font-size: 38px; line-height: 1.22; font-weight: 600; }
  .sub { margin-top: 18px; font-size: 24px; line-height: 1.4; color: #a6aba9; }
  .bar { position: absolute; left: 72px; bottom: 54px; display: flex; gap: 14px; font-size: 20px; color: #c9dbc9; }
  .bar span { border: 1px solid rgba(163, 191, 165, .35); background: rgba(95, 134, 101, .14); border-radius: 999px; padding: 8px 16px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="copy">
    <div class="brand"><img src="tiers-original/refined.png" alt=""><div class="name">STEELHUNT</div></div>
    <div class="lead">Niedocenione retro MTB<br>w promieniu 400 km od Poznania</div>
    <div class="sub">Oferty z OLX, Sprzedajemy i Kleinanzeigen wycenione według ramy, rocznika i osprzętu.</div>
  </div>
  <div class="bar"><span>Stal Cr-Mo</span><span>Lata 80. i 90.</span><span>Okazje poniżej wyceny</span></div>
</body>
</html>
